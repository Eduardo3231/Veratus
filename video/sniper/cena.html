<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Veratus · vídeo do sniper (cena)</title>
<style>
@font-face{font-family:"Cormorant Garamond";font-weight:500;font-style:normal;src:url("__BASE__/fontes/cormorant-garamond-latin-500-normal.woff2")}
@font-face{font-family:"Cormorant Garamond";font-weight:600;font-style:normal;src:url("__BASE__/fontes/cormorant-garamond-latin-600-normal.woff2")}
@font-face{font-family:"Cormorant Garamond";font-weight:500;font-style:italic;src:url("__BASE__/fontes/cormorant-garamond-latin-500-italic.woff2")}
@font-face{font-family:"Cormorant Garamond";font-weight:600;font-style:italic;src:url("__BASE__/fontes/cormorant-garamond-latin-600-italic.woff2")}
@font-face{font-family:"Jost";font-weight:400;font-style:normal;src:url("__BASE__/fontes/jost-latin-400-normal.woff2")}
@font-face{font-family:"Jost";font-weight:500;font-style:normal;src:url("__BASE__/fontes/jost-latin-500-normal.woff2")}
@font-face{font-family:"Jost";font-weight:600;font-style:normal;src:url("__BASE__/fontes/jost-latin-600-normal.woff2")}
html,body{margin:0;background:#000}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Vídeo vertical 9:16 do sniper. Tudo é função do tempo: window.draw(t) desenha o quadro de
   t segundos, sem estado entre quadros (o render.py tira uma foto de cada). A curva da bala é
   a mesma do audio.py: velocidade real no começo e, depois, velocidade proporcional à
   distância que falta, então cada metro a menos deixa a bala mais lenta. */
const R = __ROTEIRO__;
const BASE = "__BASE__", EMB_SRC = "__EMBLEMA__";
const W = R.largura, H = R.altura, FPS = R.fps, CX = W / 2, TAU = Math.PI * 2;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const OBS = "#0D0D0D", CHAR = "#2B2B2B", ASH = "#8A867F", IVO = "#F6F4F0", GOLD = "#C8A56A";
const SERIF = '"Cormorant Garamond", Georgia, serif', SANS = 'Jost, "Helvetica Neue", Arial, sans-serif';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eo2 = (t) => 1 - Math.pow(1 - clamp(t), 2);
const eo3 = (t) => 1 - Math.pow(1 - clamp(t), 3);
const eio = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function noise1(seed) {
  const r = rng(seed), N = 1024, v = Float32Array.from({ length: N }, r);
  return (x) => { const i = Math.floor(x), f = x - i, a = v[((i % N) + N) % N], b = v[(((i + 1) % N) + N) % N]; return a + (b - a) * f * f * (3 - 2 * f); };
}
function ridged(n, x, oct = 6) {
  let s = 0, a = 0.5, f = 1, w = 0;
  for (let o = 0; o < oct; o++) { s += a * (1 - Math.abs(2 * n(x * f + o * 17.3) - 1)); w += a; a *= 0.5; f *= 2.1; }
  return s / w;
}

/* ---------- utilidades de desenho ---------- */
function text(str, x, y, o = {}) {
  const { font = "40px " + SANS, fill = IVO, align = "center", ls = 0, alpha = 1, glow = null } = o;
  ctx.save();
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  ctx.letterSpacing = ls + "px"; ctx.globalAlpha *= alpha; ctx.fillStyle = fill;
  if (glow) { ctx.shadowColor = glow.c; ctx.shadowBlur = glow.b; }
  ctx.fillText(str, x + (align === "center" && ls ? ls / 2 : 0), y);
  ctx.restore();
}
function wrap(str, maxW, font) {
  ctx.save(); ctx.font = font; ctx.letterSpacing = "0px";
  const words = str.split(" "), lines = []; let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  const widest = Math.max(...lines.map((l) => ctx.measureText(l).width));
  ctx.restore();
  return { lines, widest };
}
function wrapEven(str, maxW, font) {
  const one = wrap(str, maxW, font); if (one.lines.length !== 2) return one;
  const words = str.split(" "); let best = null;
  ctx.save(); ctx.font = font; ctx.letterSpacing = "0px";
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(" "), b = words.slice(i).join(" "), wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
    if (Math.max(wa, wb) <= maxW && (!best || Math.max(wa, wb) < best.widest)) best = { lines: [a, b], widest: Math.max(wa, wb) };
  }
  ctx.restore();
  return best || one;
}
function fitFont(str, maxW, size, weight, family, ls = 0, min = 30) {
  ctx.save();
  for (; size > min; size -= 2) {
    ctx.font = `${weight} ${size}px ${family}`; ctx.letterSpacing = ls + "px";
    if (ctx.measureText(str).width <= maxW) break;
  }
  ctx.restore();
  return `${weight} ${size}px ${family}`;
}
/* números com largura fixa nos dígitos, para o painel não tremer quando o valor muda */
function tabular(str, x, y, font, align, fill, alpha = 1) {
  ctx.save(); ctx.font = font; ctx.letterSpacing = "0px"; ctx.textAlign = "left"; ctx.fillStyle = fill; ctx.globalAlpha *= alpha;
  const cell = ctx.measureText("0").width, ws = [...str].map((c) => (/\d/.test(c) ? cell : ctx.measureText(c).width));
  let px = x - (align === "right" ? ws.reduce((a, b) => a + b, 0) : align === "center" ? ws.reduce((a, b) => a + b, 0) / 2 : 0);
  [...str].forEach((c, i) => { ctx.fillText(c, px + (/\d/.test(c) ? (cell - ctx.measureText(c).width) / 2 : 0), y); px += ws[i]; });
  ctx.restore();
}
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function glow(g, cx, cy, r, rgb, a) {
  if (a <= 0 || r <= 0) return;
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
  gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.save(); g.globalCompositeOperation = "lighter"; g.fillStyle = gr; g.fillRect(cx - r, cy - r, 2 * r, 2 * r); g.restore();
}
function star(x, y, r, a) {
  if (a <= 0) return;
  glow(ctx, x, y, r * 3, "255,226,170", 0.6 * a);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.strokeStyle = `rgba(255,242,214,${a})`; ctx.lineCap = "round";
  ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x - r * 3.4, y); ctx.lineTo(x + r * 3.4, y); ctx.moveTo(x, y - r * 2.2); ctx.lineTo(x, y + r * 2.2); ctx.stroke();
  ctx.restore();
}
const NOISE = (() => {
  const c = mk(256, 256), g = c.getContext("2d"), d = g.createImageData(256, 256), r = rng(7);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
})();
const SAND = (() => {
  const c = mk(256, 256), g = c.getContext("2d"), r = rng(31);
  g.fillStyle = "#b08a4c"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5600; i++) { const s = 0.7 + r() * 1.6; g.fillStyle = r() < 0.45 ? `rgba(92,66,32,${0.3 + r() * 0.5})` : `rgba(250,228,172,${0.25 + r() * 0.6})`; g.fillRect(r() * 256, r() * 256, s, s); }
  return c;
})();
const DUST = (() => { const r = rng(11); return Array.from({ length: 50 }, () => ({ x: r() * W, y: r() * H, v: 8 + r() * 26, s: 1 + r() * 3, p: r() * TAU, a: 0.1 + r() * 0.3 })); })();
function dust(t, k = 1, wind = 0) {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (const d of DUST) {
    const y = (d.y - d.v * t + H * 4) % H, x = (((d.x + Math.sin(t * 0.7 + d.p) * 18 - wind * t * d.v) % W) + W) % W;
    ctx.fillStyle = `rgba(216,184,129,${d.a * k * (0.6 + 0.4 * Math.sin(t * 2 + d.p))})`; ctx.beginPath(); ctx.arc(x, y, d.s, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
/* frase curta de tensão no alto, no mesmo estilo do vídeo da esfera */
function topLine(str, t, t0, t1, y = 330) {
  if (!str || t < t0 || t >= t1) return;
  const u = (t - t0) / (t1 - t0), a = clamp((t - t0) / 0.14) * clamp((t1 - t) / 0.18);
  const f = fitFont(str, 960, 54, 500, SANS, 16);
  text(str, CX, y, { font: f, ls: 16, alpha: a, fill: u > 0.55 ? GOLD : IVO, glow: { c: "rgba(0,0,0,0.8)", b: 18 } });
  ctx.save(); ctx.globalAlpha = 0.8 * a; ctx.fillStyle = GOLD; const lw = 120 + 160 * u; ctx.fillRect(CX - lw / 2, y + 36, lw, 2); ctx.restore();
}

/* ---------- paisagem ---------- */
function makeSky(sx, sy, hz, seed) {
  const c = mk(W, H), g = c.getContext("2d"), f = hz / H;
  const lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, "#030304"); lg.addColorStop(f * 0.5, "#0b0a09"); lg.addColorStop(f * 0.84, "#241c13");
  lg.addColorStop(f, "#6a4f30"); lg.addColorStop(Math.min(1, f + 0.05), "#21190f"); lg.addColorStop(1, "#060505");
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  let rg = g.createRadialGradient(sx, sy, 0, sx, sy, 1100);
  rg.addColorStop(0, "rgba(236,200,140,0.50)"); rg.addColorStop(0.18, "rgba(200,165,106,0.22)"); rg.addColorStop(0.5, "rgba(200,165,106,0.06)"); rg.addColorStop(1, "rgba(200,165,106,0)");
  g.globalCompositeOperation = "lighter"; g.fillStyle = rg; g.fillRect(0, 0, W, H);
  const r = rng(seed); g.filter = "blur(8px)";
  for (let i = 0; i < 18; i++) {
    const y = hz - 50 - Math.pow(r(), 1.6) * hz * 0.7, x = r() * W, w = 240 + r() * 700, hh = 4 + r() * 14;
    const near = clamp(1 - Math.hypot(x - sx, (y - sy) * 2) / 1300);
    g.fillStyle = `rgba(222,186,128,${0.03 + 0.2 * near * (0.4 + 0.6 * r())})`; g.beginPath(); g.ellipse(x, y, w / 2, hh, 0, 0, TAU); g.fill();
  }
  g.filter = "none";
  rg = g.createRadialGradient(sx, sy, 0, sx, sy, 110); rg.addColorStop(0, "rgba(255,248,232,1)"); rg.addColorStop(0.35, "rgba(255,236,196,0.95)"); rg.addColorStop(1, "rgba(255,220,160,0)");
  g.fillStyle = rg; g.fillRect(sx - 110, sy - 110, 220, 220);
  g.globalCompositeOperation = "source-over";
  return c;
}
function makeRidge(seed, o) {
  const c = mk(W, H), g = c.getContext("2d"), n = noise1(seed), pts = [];
  const y = (x) => o.base - o.amp * (ridged(n, (x + (o.off || 0)) / o.scale) - 0.55) * 2.4;
  for (let x = -20; x <= W + 20; x += 3) pts.push([x, y(x)]);
  g.beginPath(); g.moveTo(-20, H + 10); pts.forEach(([px, py]) => g.lineTo(px, py)); g.lineTo(W + 20, H + 10); g.closePath();
  const lg = g.createLinearGradient(0, o.base - o.amp, 0, o.base + o.amp * 1.4); lg.addColorStop(0, o.top); lg.addColorStop(1, o.bottom);
  if (o.blur) g.filter = `blur(${o.blur}px)`;
  g.fillStyle = lg; g.fill();
  if (o.rim) {
    const rg = g.createLinearGradient(o.sunX - 700, 0, o.sunX + 700, 0);
    rg.addColorStop(0, "rgba(232,200,140,0)"); rg.addColorStop(0.5, o.rim); rg.addColorStop(1, "rgba(232,200,140,0)");
    g.beginPath(); pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py))); g.lineWidth = o.rimW || 1.6; g.strokeStyle = rg; g.stroke();
  }
  g.filter = "none";
  return { c, y };
}
const FOG = (() => {
  const c = mk(W * 2, 300), g = c.getContext("2d"), r = rng(77); g.filter = "blur(26px)";
  for (let i = 0; i < 44; i++) { g.fillStyle = `rgba(176,152,116,${0.05 + r() * 0.1})`; g.beginPath(); g.ellipse(r() * W * 2, 150 + (r() - 0.5) * 120, 120 + r() * 320, 18 + r() * 40, 0, 0, TAU); g.fill(); }
  return c;
})();
function fog(g, y, a, t, v = 14, sc = 1) {
  const off = (((t * v) % (W * 2)) + W * 2) % (W * 2);
  g.save(); g.globalAlpha = a; g.drawImage(FOG, -off, y - 150 * sc, W * 2, 300 * sc); g.drawImage(FOG, W * 2 - off, y - 150 * sc, W * 2, 300 * sc); g.restore();
}
function blades(seed, n, x0, x1, y0, y1, h0, h1, w0 = 1, w1 = 3.5) {
  const r = rng(seed);
  return Array.from({ length: n }, () => ({ x: lerp(x0, x1, r()), y: lerp(y0, y1, r()), h: lerp(h0, h1, r()), lean: (r() - 0.5) * 0.6, p: r() * TAU, w: lerp(w0, w1, r()) }));
}
function drawBlades(g, list, t, col, tip, sway = 1, gust = 0) {
  g.lineCap = "round";
  for (const b of list) {
    const s = Math.sin(t * 1.7 + b.p) * 0.12 * sway + b.lean - gust, tx = b.x + Math.sin(s) * b.h, ty = b.y - Math.cos(s) * b.h;
    g.beginPath(); g.moveTo(b.x, b.y); g.quadraticCurveTo(b.x + s * b.h * 0.3, b.y - b.h * 0.55, tx, ty); g.lineWidth = b.w; g.strokeStyle = col; g.stroke();
    if (tip) { g.beginPath(); g.moveTo(lerp(b.x, tx, 0.62), lerp(b.y, ty, 0.62)); g.lineTo(tx, ty); g.lineWidth = b.w * 0.7; g.strokeStyle = tip; g.stroke(); }
  }
}

/* ---------- atirador (silhueta de perfil, em cm; origem no chão sob o ombro, mira para -x) ---------- */
const SN = { s: 6, x0: -134, y0: -49, w: 330, h: 51 };
const BACK = [[-4, -38], [4, -41.5], [13, -40.5], [20, -30], [32, -29], [48, -27], [70, -24], [90, -22], [102, -21.5], [112, -18], [132, -14], [152, -12], [168, -11.5], [178, -14]];
function sniperShapes(g) {
  const poly = (pts) => { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill(); };
  const box = (x, y, w, h, r = 0.6) => { rrect(g, x, y, w, h, r); g.fill(); };
  const line = (pts, w) => { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.lineWidth = w; g.lineCap = "round"; g.lineJoin = "round"; g.stroke(); };
  // freio de boca, cano, guarda-mão, ferrolho e trilho
  box(-127, -24.6, 9.5, 5.2, 0.8);
  poly([[-118, -23.4], [-62, -23.9], [-62, -20.1], [-118, -20.6]]);
  box(-80, -26.2, 46, 7.6, 1.6); box(-36, -26.8, 29, 9.2, 1.2); box(-61, -28.2, 54, 1.8, 0.4);
  // luneta com torres e anéis
  poly([[-62, -34.6], [-56, -34.6], [-50, -33.3], [-50, -29.7], [-56, -28.4], [-62, -28.4]]);
  box(-50, -33.3, 37, 3.6, 0.8);
  poly([[-14, -33.3], [-9.5, -34.1], [-4.5, -34.1], [-4.5, -28.9], [-9.5, -28.9], [-14, -29.7]]);
  box(-34.5, -37.2, 5.5, 4.4, 0.7); box(-33.2, -38.4, 3, 1.6, 0.3);
  box(-44, -33.8, 2.6, 6, 0.4); box(-22.5, -33.8, 2.6, 6, 0.4);
  // carregador, guarda-mato, empunhadura e coronha com apoio de rosto
  poly([[-31, -18.4], [-23, -18.4], [-22.2, -10.8], [-30.2, -10.2]]);
  line([[-17.5, -18], [-17, -14.5], [-13.5, -13.6], [-10, -14.6], [-10, -18]], 0.9);
  poly([[-10, -18.6], [-3.5, -18.6], [-0.5, -8.4], [-6.5, -7.6]]);
  poly([[-8, -26.8], [4, -26.8], [5, -29.2], [17, -29.2], [18, -26], [28, -26], [29.5, -27.8], [31.5, -27.8], [31.5, -8.6], [29.5, -8.6], [27, -10.6], [4, -15.2], [-8, -18.6]]);
  // bipé
  line([[-73, -19.5], [-83, -0.6]], 1.4); line([[-71, -19.5], [-66, -0.6]], 1.3);
  box(-85, -1.2, 4.2, 1.2, 0.3); box(-68, -1.2, 4.2, 1.2, 0.3);
  // atirador deitado: cabeça com capuz, tronco, pernas e o braço do gatilho
  g.beginPath(); g.ellipse(9.5, -31.5, 9.8, 9, -0.25, 0, TAU); g.fill();
  poly([[-1.5, -35.5], [-7.8, -35], [-7.4, -33.4], [0, -32.6]]);
  poly([[6, -22], [12, -27], [20, -29.5], [32, -28.5], [48, -26.5], [70, -23.5], [90, -21.5], [102, -21], [112, -17.5], [132, -13.5], [152, -11.5], [168, -11], [176, -13.5], [180.5, -20], [185, -20], [186, -13], [188, -6], [187, -0.4], [6, -0.4], [2, -9]]);
  line([[17, -21], [9, -10], [4, -2.2]], 7.2);
  line([[4, -2.6], [-2, -7.2], [-5.5, -11.5]], 6);
  g.beginPath(); g.arc(-5.5, -12.5, 3.6, 0, TAU); g.fill();
  // fios do ghillie no contorno das costas e do capuz
  const r = rng(91);
  for (let i = 0; i < 190; i++) {
    const k = r() * (BACK.length - 1), j = Math.floor(k), f = k - j, px = lerp(BACK[j][0], BACK[j + 1][0], f), py = lerp(BACK[j][1], BACK[j + 1][1], f) + 0.6;
    const a = -Math.PI / 2 + (r() - 0.62) * 1.8, l = 1.4 + r() * 4.6;
    line([[px, py], [px + Math.cos(a) * l, py + Math.sin(a) * l]], 0.35 + r() * 0.6);
  }
}
function makeSniper(col) {
  const c = mk(Math.ceil(SN.w * SN.s), Math.ceil(SN.h * SN.s)), g = c.getContext("2d");
  g.scale(SN.s, SN.s); g.translate(-SN.x0, -SN.y0); g.fillStyle = g.strokeStyle = col; sniperShapes(g);
  return c;
}
let SN_IMG, SN_RIM;
function drawSniper(ox, oy, k, rim = 1) {
  const s = k / SN.s, x = ox + SN.x0 * k, y = oy + SN.y0 * k, w = SN_IMG.width * s, h = SN_IMG.height * s;
  if (rim > 0) { ctx.save(); ctx.globalAlpha = clamp(rim); ctx.shadowColor = "rgba(232,200,140,0.9)"; ctx.shadowBlur = 8; ctx.drawImage(SN_RIM, x - 2.4, y - 2, w, h); ctx.restore(); }
  ctx.drawImage(SN_IMG, x, y, w, h);
}

/* ---------- ampulheta (o alvo) ---------- */
function hgGeom(cx, by, h) {
  const pt = 0.065 * h, gh = h - 2 * pt, rb = 0.235 * h, rn = 0.02 * h, y0 = by - h + pt, yn = y0 + gh / 2, y1 = by - pt;
  const r = (y) => { const a = Math.abs((y - y0) / gh - 0.5) * 2, b = 1 - Math.pow((a - 0.56) / 0.56, 2); return Math.max(rn, rb * Math.sqrt(Math.max(0, b))); };
  return { cx, by, h, pt, gh, rb, rn, y0, yn, y1, r, upper: y0 + gh * 0.25 };
}
function drawHourglass(g, cx, by, h, t) {
  const G = hgGeom(cx, by, h), { pt, gh, rb, y0, yn, y1, r } = G;
  const path = () => { g.beginPath(); for (let y = y0; y <= y1; y += gh / 140) g.lineTo(cx - r(y), y); for (let y = y1; y >= y0; y -= gh / 140) g.lineTo(cx + r(y), y); g.closePath(); };
  const post = (x, a, w) => {
    const lg = g.createLinearGradient(x - w / 2, 0, x + w / 2, 0); lg.addColorStop(0, "#050505"); lg.addColorStop(0.6, "#1b1916"); lg.addColorStop(1, "#5e4b32");

  text(c.titulo, CX, 380 + 20 * (1 - a), { font: tf, fill: GOLD, alpha: a, glow: { c: "rgba(0,0,0,0.7)", b: 30 } });
  ctx.save(); ctx.globalAlpha = a * 0.9; ctx.fillStyle = GOLD; ctx.fillRect(CX - 110, 424, 220, 2); ctx.restore();
  c.itens.forEach((it, i) => {
    const k = eo3((t - it.t) / 0.4), y = 620 + i * 230, x0 = 100; if (k <= 0) return;
    ctx.save(); ctx.translate(-60 * (1 - k), 0);
    sight(x0 + 42, y, 30 + 14 * (1 - k), k);
    const { lines } = wrapEven(it.texto, 820, `500 56px ${SANS}`), fs = lines.length > 1 ? 52 : 56;
    lines.forEach((ln, j) => text(ln, x0 + 120, y + 20 + j * 64 - (lines.length - 1) * 32 - (it.sub ? 18 : 0), { font: `500 ${fs}px ${SANS}`, align: "left", alpha: k }));
    if (it.sub) text(it.sub, x0 + 120, y + 62, { font: `400 38px ${SANS}`, align: "left", fill: ASH, alpha: k });

  });

}
function drawFinal(f, t) {
  const u = t - f.t0;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  glow(ctx, CX, 640, 900, "200,165,106", 0.2 * eo3(u / 1.2)); dust(t, 0.9);
  const k = eo3(u / 0.9), ew = 520 * (0.86 + 0.14 * k), ey = 600;
  ctx.save(); ctx.translate(CX, ey); ctx.rotate(u * 0.12); ctx.globalAlpha = 0.5 * k; ctx.strokeStyle = GOLD; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 380, 0, TAU); ctx.stroke();
  for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.moveTo(352, 0); ctx.lineTo(410, 0); ctx.stroke(); }
  for (let i = 0; i < 72; i++) { const a = (i / 72) * TAU, l = i % 6 ? 6 : 14; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 380, Math.sin(a) * 380); ctx.lineTo(Math.cos(a) * (380 - l), Math.sin(a) * (380 - l)); ctx.stroke(); }
  ctx.restore();
  emblemSweep(CX, ey, ew, (u - 0.25) / 1.1, clamp(u / 0.5));
  const am = eo3((t - f.t_marca) / 0.7);
  text(f.marca, CX, 1100 + 16 * (1 - am), { font: `600 128px ${SERIF}`, fill: GOLD, ls: 30, alpha: am, glow: { c: "rgba(200,165,106,0.45)", b: 30 } });
  const al = eo3((t - f.t_linha) / 0.7), fl = `italic 500 92px ${SERIF}`, ll = wrapEven(f.linha, 900, fl).lines;
  ctx.save(); ctx.globalAlpha = al * 0.8; ctx.fillStyle = GOLD; ctx.fillRect(CX - 90 * al, 1150, 180 * al, 2); ctx.restore();
  ll.forEach((ln, i) => text(ln, CX, 1270 + i * 100 + 18 * (1 - al), { font: fl, alpha: al }));
  const ab = eo3((t - f.t_botao) / 0.55), pulse = 1 + 0.016 * Math.sin((t - f.t_botao) * 5), by = 1270 + ll.length * 100 + 120;
  if (ab > 0) {
    ctx.save(); ctx.globalAlpha = ab; ctx.translate(CX, by + 24 * (1 - ab)); ctx.scale(pulse, pulse);
    ctx.shadowColor = "rgba(200,165,106,0.55)"; ctx.shadowBlur = 40 + 18 * Math.sin((t - f.t_botao) * 5);
    rrect(ctx, -400, -72, 800, 144, 72); const g = ctx.createLinearGradient(0, -72, 0, 72); g.addColorStop(0, "#DFC28A"); g.addColorStop(1, "#B58B4C"); ctx.fillStyle = g; ctx.fill();
    ctx.shadowBlur = 0; text(f.botao, 0, 20, { font: `600 54px ${SANS}`, fill: OBS, ls: 1 }); ctx.restore();
    text(f.numero, CX, by + 168, { font: `500 52px ${SANS}`, alpha: ab, ls: 2 });
  }
}

/* ---------- linha do tempo ---------- */
const SCENES = [
  { t0: AB.atirador.t0, t1: AB.atirador.t1, fade: 0, draw: drawA },
  { t0: AB.alvo.t0, t1: AB.alvo.t1, fade: 0.2, draw: drawB },

function post(t) {
  const v = ctx.createRadialGradient(CX, H / 2, 480, CX, H / 2, 1250); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.5)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fr = Math.floor(t * FPS), r = rng(fr * 7919 + 3), ox = (r() * 256) | 0, oy = (r() * 256) | 0;
  ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 0.09; ctx.translate(-ox, -oy);
  ctx.fillStyle = ctx.createPattern(NOISE, "repeat"); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}
window.draw = (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.shadowBlur = 0; ctx.filter = "none";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  let i = SCENES.findIndex((s) => t >= s.t0 && t < s.t1); if (i < 0) i = t < SCENES[0].t0 ? 0 : SCENES.length - 1;
  const s = SCENES[i], a = s.fade ? eo2((t - s.t0) / s.fade) : 1;
  if (i > 0 && a < 1) SCENES[i - 1].draw(SCENES[i - 1].t1 - 1e-3);
  ctx.save(); ctx.globalAlpha = a; s.draw(t); ctx.restore();
  post(t);
};
window.tempos = { T_MACRO, K, S1 };
