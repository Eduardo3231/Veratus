name: Verify Veratus

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Lint and format
        shell: bash
        run: |
          python -m ruff check . --output-format=github
          if ! python -m ruff format --check . > /tmp/ruff-format.log 2>&1; then
            cat /tmp/ruff-format.log
            python -c 'from pathlib import Path; message=Path("/tmp/ruff-format.log").read_text().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print(f"::error file=.github/workflows/verify.yml,line=24::{message}")'
            exit 1
          fi
      - name: Check Python bytecode compilation
        run: python -m compileall -q api integrations veratus_agents tests
      - name: Build webhook image
        run: docker build -f integrations/Dockerfile -t veratus-webhook .
