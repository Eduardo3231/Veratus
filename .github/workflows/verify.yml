name: Verify Veratus

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Lint and format
        shell: bash
        run: |
          python -m ruff check . --output-format=github
          output="$(python -m ruff format --check . 2>&1)" || {
            output="${output//'%'/'%25'}"
            output="${output//$'\n'/'%0A'}"
            output="${output//$'\r'/'%0D'}"
            echo "::error file=.github/workflows/verify.yml,line=24::$output"
            exit 1
          }
      - name: Check Python bytecode compilation
        run: python -m compileall -q api integrations veratus_agents tests
      - name: Build webhook image
        run: docker build -f integrations/Dockerfile -t veratus-webhook .
