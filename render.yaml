      - key: VERATUS_AGENT_MAX_TOTAL_TOKENS
        value: "12000"
      - key: VERATUS_AGENT_SESSION_HISTORY_LIMIT
        value: "30"
      - key: VERATUS_AGENT_TRACE_SENSITIVE_DATA
        value: "false"
      - key: OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA
        value: "0"
      - key: OPENAI_AGENTS_DONT_LOG_MODEL_DATA
        value: "1"
      - key: OPENAI_AGENTS_DONT_LOG_TOOL_DATA
        value: "1"
